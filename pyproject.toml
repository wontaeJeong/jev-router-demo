[project]
name = "jev-router-demo"
version = "0.1.0"
description = "Rich CLI comparison of local agent routing backends"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["rich>=13.9", "httpx>=0.28", "python-dotenv>=1.0", "pydantic>=2.10"]

[project.scripts]
jev-router-demo = "jev_router_demo.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
